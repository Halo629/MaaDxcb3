name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 MaaFramework：include/lib 用于编译 agent，bin 用于运行时 DLL（latest 正式版）
      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64*.zip"
          latest: true
          out-file-path: deps
          extract: true

      # 下载 MXU：前端外壳 mxu.exe（latest 正式版）
      - name: Download MXU
        uses: robinraju/release-downloader@v1
        with:
          repository: MistEO/MXU
          fileName: "*win-x86_64*.zip"
          latest: true
          out-file-path: downloads/MXU
          extract: true

      - name: Build cpp-service
        shell: pwsh
        run: |
          $sdk = if (Test-Path "deps/include") { "${{ github.workspace }}/deps" } else { (Get-ChildItem deps -Directory | Select-Object -First 1).FullName }
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DMAA_ROOT=$sdk" "-DMEOJSON_INCLUDE=${{ github.workspace }}/third_party"
          cmake --build build --config Release

      - name: Assemble
        shell: pwsh
        run: |
          $sdk = if (Test-Path "deps/include") { "${{ github.workspace }}/deps" } else { (Get-ChildItem deps -Directory | Select-Object -First 1).FullName }

          New-Item install -ItemType Directory -Force

          # 1. MXU 前端：mxu.exe 改名
          $mxu = Get-ChildItem downloads/MXU -Recurse -Filter mxu.exe | Select-Object -First 1
          if (-not $mxu) { throw "mxu.exe not found" }
          Copy-Item $mxu.FullName "install/MaaDxcb3.exe"

          # 2. MaaFramework DLL 覆盖 maafw
          New-Item install/maafw -ItemType Directory -Force
          Copy-Item "$sdk/bin/*" install/maafw/ -Recurse -Force

          # 3. 项目文件
          Copy-Item interface.json install/ -Force
          Copy-Item resource install/ -Recurse -Force
          Copy-Item assets install/ -Recurse -Force

          # 4. agent（动态编译的 cpp-service）
          New-Item install/agent -ItemType Directory -Force
          Copy-Item build/Release/cpp-service.exe install/agent/cpp-service.exe -Force

      # 用 MaaFramework 的 Python 绑定计算资源 hash，回填 interface.json（version + hash）
      - name: Fill interface.json (version + resource hash)
        shell: pwsh
        run: |
          python -m pip install --quiet maafw
          python tools/fill_interface.py --version "${{ github.ref_name }}" --interface install/interface.json

      - name: Convert PNG to ICO
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python -c "from PIL import Image; im=Image.open('assets/MaaDxcb3.png'); im.save('MaaDxcb3.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256),(512,512)])"

      - name: Set exe icon
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit.exe
          .\rcedit.exe "install/MaaDxcb3.exe" --set-icon MaaDxcb3.ico

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path install/* -DestinationPath MaaDxcb3-win-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaaDxcb3-win-x86_64
          path: MaaDxcb3-win-x86_64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MaaDxcb3-win-x86_64.zip
